<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#efe8dd">
<title>認定鑑定師のご紹介｜ユンスル四柱推命</title>
<meta name="description" content="ユンスル四柱推命の認定鑑定師のご紹介。各鑑定師のInstagramはこちらから。">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&family=Noto+Sans+JP:wght@400;500&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html { background: #efe8dd; color-scheme: light; }
body {
  font-family: 'Noto Sans JP', 'Hiragino Sans', sans-serif;
  background: #efe8dd; color: #333;
  min-height: 100vh; padding: 2.2rem 1rem 2rem;
  line-height: 1.8;
}
.container { max-width: 560px; margin: 0 auto; }

.back {
  display: inline-block; font-size: 0.8rem; color: #7babdb;
  text-decoration: none; margin-bottom: 1.4rem; letter-spacing: 0.08em;
}
.back:hover { text-decoration: underline; }

.pagehead { text-align: center; margin-bottom: 2.2rem; }
.pagehead h1 {
  font-family: 'Zen Maru Gothic', 'Noto Sans JP', sans-serif;
  font-weight: 700; font-size: 1.45rem; color: #7babdb;
  letter-spacing: 0.22em; padding-left: 0.22em;
}
.pagehead .sub {
  font-size: 0.8rem; color: #8a8377; letter-spacing: 0.15em; margin-top: 0.3rem;
}

.card {
  background: #fff; border-radius: 12px;
  padding: 1.5rem; margin-bottom: 1.2rem;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}
.card > p { font-size: 0.88rem; color: #555; margin-bottom: 0.6rem; }

/* 鑑定師リスト */
.member {
  display: flex; align-items: center; gap: 1rem;
  padding: 0.9rem 0.3rem;
  border-bottom: 1px dashed #efe8dd;
  text-decoration: none; color: #333;
  transition: background 0.15s ease;
}
.member:last-of-type { border-bottom: none; }
.avatar {
  width: 52px; height: 52px; flex: 0 0 52px;
  border-radius: 50%;
  background: linear-gradient(135deg, #f9ce34 0%, #ee2a7b 50%, #6228d7 100%);
  padding: 2.5px;
}
.avatar .inner {
  width: 100%; height: 100%; border-radius: 50%;
  background: #fff;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Zen Maru Gothic', sans-serif; font-weight: 700;
  font-size: 1.15rem; color: #7babdb;
  overflow: hidden;
}
.avatar .inner img { width: 100%; height: 100%; object-fit: cover; }
.minfo { flex: 1; min-width: 0; }
.member:hover { background: #f8f5ef; border-radius: 8px; }
.handle {
  font-size: 1.02rem; font-weight: 500; color: #333;
  overflow-wrap: anywhere; margin-bottom: 0.15rem;
}
.mlabel { font-size: 0.78rem; color: #8a8377; letter-spacing: 0.05em; }
.mlabel .at { color: #b9b1a3; }

footer {
  text-align: center; font-size: 0.72rem; color: #b9b1a3;
  letter-spacing: 0.12em; margin-top: 2.4rem;
}
</style>
</head>
<body>
<div class="container">

  <a class="back" href="./index.html">← トップにもどる</a>

  <div class="pagehead">
    <h1>認定鑑定師のご紹介</h1>
    <p class="sub">ユンスル四柱推命 認定鑑定師</p>
  </div>

  <div class="card">
    <p>ユンスル四柱推命を学び、認定試験に合格した認定鑑定師です。それぞれのInstagramで活動をご覧いただけます。</p>

    <div id="members"></div>
  </div>
    <script>
    // ★ 鑑定師の追加・変更はこのリストだけ編集すればOK
    //    handle: Instagramのユーザー名 / name: 表示名
    //    アイコンは icons/ユーザー名.jpg を置けば自動で表示されます
    //    (アイコン変更は同名で画像を差し替えるだけ。画像がない人は頭文字が表示されます)
    const KANTEISHI = [
      { handle: 'itasan_kantei',     name: 'いたさん。' },
      { handle: 'oka_yukao',         name: 'おかゆかお' },
      { handle: 'tutinoemi.4suimei', name: 'つちのえみ' },
      { handle: 'renrenstyle',       name: '蓮々' },
    ];

    document.getElementById('members').innerHTML = KANTEISHI.map(m => `
      <a class="member" href="https://www.instagram.com/${m.handle}/" target="_blank" rel="noopener" data-initial="${m.name.charAt(0)}">
        <div class="avatar"><div class="inner">
          <img src="icons/${m.handle}.jpg" alt="" loading="lazy"
               onerror="this.style.display='none';this.insertAdjacentHTML('afterend','<span>'+this.closest('.member').dataset.initial+'</span>')">
        </div></div>
        <div class="minfo">
          <div class="handle">${m.name}</div>
          <div class="mlabel"><span class="at">@</span>${m.handle}</div>
        </div>
      </a>`).join('');
    </script>

  <footer>&copy; ユンスル四柱推命&reg;</footer>

</div>
</body>
</html>
