<style>
  :root{
    --accent:#e699ac;
    --bg:#efe8dd;
    --card:#ffffff;
    --ink:#333333;
    --ink-soft:#999999;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{
    font-family:'Noto Sans JP','Hiragino Sans',sans-serif;
    background:var(--bg); color:var(--ink);
    min-height:100%;
    display:flex; justify-content:center;
    padding:2rem 1rem 3rem;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{ width:100%; max-width:420px; }

  /* header（meishiki と同じ青ボックス＋ロゴ） */
  .header{
    background:var(--accent); border-radius:12px;
    padding:1rem 1rem .95rem; margin-bottom:1.2rem; text-align:center;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
  }
  .header .brand{ margin:0 auto; }
  .header .logo{
    width:118px; height:auto; display:block; margin:0 auto .45rem;
  }
  .header .htitle{
    font-size:1.2rem; font-weight:500; color:#fff;
    letter-spacing:.1em; padding-left:.1em; white-space:nowrap;
  }

  /* date picker */
  .picker{ display:flex; gap:8px; align-items:center; margin-bottom:1.4rem; }
  .picker input[type="date"]{
    flex:1; font-family:inherit; font-size:15px; color:var(--ink);
    padding:10px 12px; border:1px solid #ddd; border-radius:8px;
    background:#fafafa; -webkit-appearance:none; appearance:none;
  }
  .picker input[type="date"]:focus{ outline:none; border-color:var(--accent); }
  .picker button{
    font-family:inherit; font-size:14px; font-weight:500; color:#fff;
    padding:11px 16px; border:none; border-radius:8px;
    background:var(--accent); cursor:pointer; letter-spacing:.05em; white-space:nowrap;
  }

  /* date line */
  .date{ text-align:center; margin-bottom:1.1rem; }
  .date .wareki{ font-size:12px; letter-spacing:.1em; color:var(--ink-soft); }
  .date .seireki{ font-size:1.5rem; font-weight:500; margin-top:3px; letter-spacing:.04em; }
  .date .yobi{ color:var(--accent); }
  .date .sekki{ font-size:0.95rem; font-weight:500; color:#e699ac; letter-spacing:.1em; margin-top:7px; }
  .date .sekki:empty{ display:none; }

  /* hero: 日干支（線なし・上げる） */
  .hero{
    background:var(--card); border-radius:12px;
    padding:1rem 1.2rem 1.4rem; text-align:center;
  }
  .hero .label{
    font-size:11px; letter-spacing:.3em; color:var(--ink-soft); margin-bottom:.3rem;
  }
  .kanji{
    font-size:4rem; font-weight:500; line-height:1.1; letter-spacing:.12em;
    color:var(--ink); padding:.1rem 0;
  }
  .yomi{ font-size:13px; letter-spacing:.16em; color:var(--ink-soft); margin-top:.3rem; }

  /* hitokoto */
  .hitokoto{
    text-align:center; margin:1.4rem .4rem .2rem;
    font-size:1.05rem; font-weight:500; line-height:1.8; letter-spacing:.03em;
  }
  .hitokoto .accent{ color:var(--accent); }
  .hitokoto:empty{ display:none; }

  /* pillars: 月 → 年 */
  .pillars{ display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-top:1.6rem; }
  .pillar{ background:var(--card); border-radius:12px; padding:.9rem .5rem .8rem; text-align:center; }
  .pillar .cap{ font-size:12px; color:var(--ink-soft); margin-bottom:6px; }
  .pillar .gk{ font-size:1.8rem; font-weight:500; letter-spacing:.08em; }
  .pillar .ym{ font-size:11px; color:var(--ink-soft); margin-top:4px; letter-spacing:.06em; }

  .note{ margin-top:1.6rem; font-size:11px; line-height:2; color:var(--ink-soft); letter-spacing:.02em; }
  .note:empty{ display:none; }
  .note .warn{ color:#c0784b; }

  .foot{ text-align:center; font-size:11px; color:var(--accent); margin-top:1.4rem; }

  @media (max-width:380px){ .kanji{ font-size:3.4rem; } .date .seireki{ font-size:1.35rem; } }
</style>
</head>

/* ===== 計算ロジック（meishiki.html と同一） ===== */
function termMs(y,mo){
  const t=ST[y]&&ST[y][mo];
  if(!t)return null;
  return new Date(y,mo-1,t.d,t.h,t.m).getTime();
}
const CAL2SOLAR={2:1,3:2,4:3,5:4,6:5,7:6,8:7,9:8,10:9,11:10,12:11,1:12};
function getSolarMonth(y,mo,d,h,mi){
  const now=new Date(y,mo-1,d,h,mi).getTime();
  const tm=termMs(y,mo);
  if(tm!==null){
    if(now>=tm)return CAL2SOLAR[mo];
    const pmo=mo===1?12:mo-1;
    return CAL2SOLAR[pmo]||(pmo===1?12:1);
  }
  return CAL2SOLAR[mo]||1;
}
function getPYear(y,mo,d,h,mi){
  if(mo===1)return y-1;
  if(mo===2){
    const tm=termMs(y,2);
    if(tm!==null&&new Date(y,1,d,h,mi).getTime()<tm)return y-1;
  }
  return y;
}
function yearIdx(y){ return((y-1984)%60+60)%60; }
function gzIdx(stem,branch){ for(let i=0;i<60;i++){ if(i%10===stem&&i%12===branch)return i; } return 0; }
function monthIdx(pYear,sMonth){
  const yStem=yearIdx(pYear)%10;
  const base=[2,4,6,8,0,2,4,6,8,0];
  const mStem=(base[yStem]+(sMonth-1))%10;
  const mBranch=(2+(sMonth-1))%12;
  return gzIdx(mStem,mBranch);
}
function dayIdx(y,mo,d){
  const base=new Date(1900,0,1).getTime();
  const target=new Date(y,mo-1,d).getTime();
  const diff=Math.round((target-base)/86400000);
  return((10+diff)%60+60)%60;
}

/* ===== 二十四節気 =====
   12「節」は ST（検証済み・日付のみ使用）、12「中気」は概算日。
   その日が節気の入り日のときだけ節気名を返す（節入り時刻は使わない）。 */
const SEKKI_SETSU=[ // ST のカレンダー月キー → 節名
  {mo:2,name:'立春'},{mo:3,name:'啓蟄'},{mo:4,name:'清明'},{mo:5,name:'立夏'},
  {mo:6,name:'芒種'},{mo:7,name:'小暑'},{mo:8,name:'立秋'},{mo:9,name:'白露'},
  {mo:10,name:'寒露'},{mo:11,name:'立冬'},{mo:12,name:'大雪'},{mo:1,name:'小寒'}
];
const SEKKI_CHUKI=[ // [月,日,中気名]（概算）
  [2,19,'雨水'],[3,20,'春分'],[4,20,'穀雨'],[5,21,'小満'],
  [6,21,'夏至'],[7,23,'大暑'],[8,23,'処暑'],[9,23,'秋分'],
  [10,23,'霜降'],[11,22,'小雪'],[12,22,'冬至'],[1,20,'大寒']
];
function getSekkiOnDay(y,m,d){
  for(const s of SEKKI_SETSU){           // 節（ST の日付）
    const t=ST[y]&&ST[y][s.mo];
    if(t && s.mo===m && t.d===d) return s.name;
  }
  for(const c of SEKKI_CHUKI){           // 中気（概算日）
    if(c[0]===m && c[1]===d) return c[2];
  }
  return null;
}

/* ===== 和暦 ===== */
function wareki(y,m,d){
  const ymd=y*10000+m*100+d;
  if(ymd>=20190501) return "令和"+(y-2018)+"年";
  if(ymd>=19890108) return "平成"+(y-1988)+"年";
  if(ymd>=19261225) return "昭和"+(y-1925)+"年";
  if(ymd>=19120730) return "大正"+(y-1911)+"年";
  return "";
}

/* ===== 描画 ===== */
function pad(n){ return n<10?"0"+n:""+n; }
function gks(s,b){ return STEMS[s]+BRANCHES[b]; }
function yom(s,b){ return STEM_YOMI[s]+BRANCH_YOMI[b]; }

function render(date, isToday){
  const y=date.getFullYear(), m=date.getMonth()+1, d=date.getDate();
  const yobi="日月火水木金土"[date.getDay()];
  const h = isToday ? date.getHours() : 12;
  const mi = isToday ? date.getMinutes() : 0;

  const pYear=getPYear(y,m,d,h,mi);
  const sMonth=getSolarMonth(y,m,d,h,mi);
  const yi=yearIdx(pYear), mIdx=monthIdx(pYear,sMonth), di=dayIdx(y,m,d);
  const ds=di%10, db=di%12;

  document.getElementById("wareki").textContent = wareki(y,m,d);
  document.getElementById("seireki").innerHTML =
    `${y}年${m}月${d}日<span class="yobi">（${yobi}）</span>`;

  const sk=getSekkiOnDay(y,m,d);
  document.getElementById("sekki").textContent = sk || "";

  document.getElementById("dayKanji").textContent = gks(ds,db);
  document.getElementById("dayYomi").textContent  = yom(ds,db);

  const ht=HITOKOTO[di]||"", dot=ht.indexOf("。");
  document.getElementById("hitokoto").innerHTML = dot>0
    ? `<span class="accent">${ht.slice(0,dot+1)}</span>${ht.slice(dot+1)}`
    : ht;

  document.getElementById("mGk").textContent = gks(mIdx%10,mIdx%12);
  document.getElementById("mYm").textContent = yom(mIdx%10,mIdx%12);
  document.getElementById("yGk").textContent = gks(yi%10,yi%12);
  document.getElementById("yYm").textContent = yom(yi%10,yi%12);

  const inRange = (y>1926 || (y===1926 && m>=2)) && (y<=2027);
  document.getElementById("note").innerHTML = inRange
    ? ""
    : `<span class="warn">※ 年干支・月干支・二十四節気の収録範囲は1926年2月〜2027年です。範囲外は概算になります（日干支は正確）。</span>`;

  const inp=document.getElementById("dateInput");
  const v=`${y}-${pad(m)}-${pad(d)}`;
  if(inp.value!==v) inp.value=v;
}

document.getElementById("dateInput").addEventListener("change",e=>{
  const p=e.target.value.split("-").map(Number);
  if(p.length===3 && !isNaN(p[0])) render(new Date(p[0],p[1]-1,p[2]), false);
});
document.getElementById("todayBtn").addEventListener("click",()=>render(new Date(), true));

render(new Date(), true);
</script>
