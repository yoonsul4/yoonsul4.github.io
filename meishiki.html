<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#efe8dd">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500&display=swap" rel="stylesheet">
<title>命式作成</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html { background: #efe8dd; color-scheme: light; }
body { font-family: 'Noto Sans JP', 'Hiragino Sans', sans-serif; background: #efe8dd; min-height: 100vh; padding: 2rem 1rem; }
h1 { text-align: center; font-size: 1.6rem; font-weight: 500; color: #7babdb; letter-spacing: 0.3em; padding-left: 0.3em; margin-bottom: 2rem; }
.h1-sub { text-align: center; font-size: 0.75rem; color: #7babdb; letter-spacing: 0.15em; margin-top: -1.8rem; margin-bottom: 2rem; }
.container { max-width: 560px; margin: 0 auto; }
.card { background: #fff; border-radius: 12px; padding: 1.5rem; margin-bottom: 1.2rem; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
label { font-size: 13px; color: #333333; display: block; margin-bottom: 6px; }
input, select { width: 100%; max-width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; font-family: inherit; margin-bottom: 1rem; color: #333; background: #fafafa; box-sizing: border-box; -webkit-appearance: none; appearance: none; }
input:focus, select:focus { outline: none; border-color: #7babdb; background: #fff; }
input:focus { color: #7babdb; }
button { width: 100%; padding: 12px; font-size: 15px; font-weight: 500; cursor: pointer; border-radius: 8px; background: #7babdb; border: none; color: #fff; letter-spacing: 0.05em; }
button:hover { background: #6a9acb; }
.pillars { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 0.3rem; }
.pillar { text-align: center; }
.plabel { font-size: 12px; color: #999; margin-bottom: 6px; }
.pval { font-weight: 500; color: #333333; background: #ffffff; border-radius: 8px; padding: 4px 4px; }
.pval .stem { font-size: 2rem; display: block; border-bottom: 1px dashed #efe8dd; border-top: 1px solid #efe8dd; padding: 10px 0; margin-bottom: 0; }
.pval .branch { font-size: 2rem; display: block; padding: 10px 0; border-bottom: 1px solid #efe8dd; }
.info { font-size: 12px; color: #aaa; line-height: 2; padding-top: 0.3rem; margin-top: 0; }
.err { color: #c0392b; font-size: 13px; margin-top: 6px; }
.hidden { display: none; }
.daiun-title { font-size: 14px; font-weight: 500; color: #333; margin-bottom: 10px; }
.daiun-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.daiun-table tr { border-bottom: 1px dashed #efe8dd; }
.daiun-table td { text-align: center; padding: 10px 8px; vertical-align: middle; }
.daiun-table .age { color: #999; font-size: 12px; text-align: left; padding-left: 8px; }
.daiun-table .gz-stem { font-size: 1.4rem; font-weight: 500; color: #333; display: inline-block; margin-right: 4px; }
.daiun-table .gz-branch { font-size: 1.4rem; font-weight: 500; color: #333; display: inline-block; }
.daiun-table .current td { background: #fff8cc; }
.daiun-table .pre td { }
.daiun-table .pre .gz-stem,
.daiun-table .pre .gz-branch { color: #333; }
.daiun-table .pre .age { color: #999; }
</style>
</head>

function termMs(y,mo){
  const t=ST[y]&&ST[y][mo];
  if(!t)return null;
  return new Date(y,mo-1,t.d,t.h,t.m).getTime();
}

function getSolarMonth(y,mo,d,h,mi){
  const now=new Date(y,mo-1,d,h,mi).getTime();
  const calToSolar={2:1,3:2,4:3,5:4,6:5,7:6,8:7,9:8,10:9,11:10,12:11,1:12};
  const tm=termMs(y,mo);
  if(tm!==null){
    if(now>=tm)return calToSolar[mo];
    const pmo=mo===1?12:mo-1;
    return calToSolar[pmo]||(pmo===1?12:1);
  }
  return calToSolar[mo]||1;
}

function getPYear(y,mo,d,h,mi){
  if(mo===1)return y-1;
  if(mo===2){
    const tm=termMs(y,2);
    if(tm!==null&&new Date(y,1,d,h,mi).getTime()<tm)return y-1;
  }
  return y;
}

function yearIdx(y){return((y-1984)%60+60)%60;}

function monthIdx(pYear,sMonth){
  const yStem=yearIdx(pYear)%10;
  const base=[2,4,6,8,0,2,4,6,8,0];
  const mStem=(base[yStem]+(sMonth-1))%10;
  const mBranch=(2+(sMonth-1))%12;
  return gzIdx(mStem,mBranch);
}

function dayIdx(y,mo,d){
  const base=new Date(1900,0,1).getTime();
  const target=new Date(y,mo-1,d).getTime();
  const diff=Math.round((target-base)/86400000);
  return((10+diff)%60+60)%60;
}

function hourIdx(dIdx,h){
  let hBranch;
  if(h===0||h===23)hBranch=0;
  else hBranch=Math.floor((h+1)/2)%12;
  // 夜子時(23時台)は翌日の日干で時干を出す（日柱は当日のまま）
  const dStem=(h===23?(dIdx+1):dIdx)%10;
  const base=[0,2,4,6,8,0,2,4,6,8];
  const hStem=(base[dStem]+hBranch)%10;
  return gzIdx(hStem,hBranch);
}

function gzIdx(stem,branch){
  const s=['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'][stem];
  const b=['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'][branch];
  return GZ.indexOf(s+b);
}

function getEOT(month, day) {
  const dpm=[0,31,28,31,30,31,30,31,31,30,31,30,31];
  let n=0;
  for(let i=1;i<month;i++) n+=dpm[i];
  n+=day-1;
  return EOT[n]||0;
}

// 大運計算
function calcDaiun(birthY, birthM, birthD, monthPillarIdx, yearStem, gender, birthYear) {
  // 陽干: 甲(0)丙(2)戊(4)庚(6)壬(8), 陰干: 乙(1)丁(3)己(5)辛(7)癸(9)
  const isYangStem = yearStem % 2 === 0;
  const isMale = gender === 'm';
  // 順行: 陽男・陰女, 逆行: 陰男・陽女
  const isForward = (isYangStem && isMale) || (!isYangStem && !isMale);

  // 節入り日を取得（日付のみ・時刻は使わない）
  function getTermDate(y, calMonth) {
    const t = ST[y] && ST[y][calMonth];
    if (!t) return null;
    return new Date(y, calMonth - 1, t.d).getTime();
  }

  // 生年月日のDate（時刻は使わない＝誕生日0:00基準で日付差を取る）
  const birthDate = new Date(birthY, birthM - 1, birthD).getTime();

  let days;
  if (isForward) {
    // 次の節入り日までの日数（節入り日まで数え、誕生日はカウントしない）
    const thisTermMs = getTermDate(birthY, birthM);
    let nextTermMs, nextY = birthY, nextMo = birthM;
    if (thisTermMs !== null && birthDate < thisTermMs) {
      nextTermMs = thisTermMs;
    } else {
      nextMo = birthM === 12 ? 1 : birthM + 1;
      nextY = birthM === 12 ? birthY + 1 : birthY;
      nextTermMs = getTermDate(nextY, nextMo);
    }
    if (!nextTermMs) return null;
    days = Math.round((nextTermMs - birthDate) / 86400000);
  } else {
    // 前の節入り日までの日数
    const thisTermMs = getTermDate(birthY, birthM);
    let prevTermMs;
    if (thisTermMs !== null && birthDate >= thisTermMs) {
      prevTermMs = thisTermMs;
    } else {
      const prevMo = birthM === 1 ? 12 : birthM - 1;
      const prevY = birthM === 1 ? birthY - 1 : birthY;
      prevTermMs = getTermDate(prevY, prevMo);
    }
    if (!prevTermMs) return null;
    days = Math.round((birthDate - prevTermMs) / 86400000);
  }

  const quotient = Math.floor(days / 3);
  const remainder = days % 3;
  const extraMonths = remainder * 4;

  // 立運の年・月
  const startAge = quotient;
  const startMonth = extraMonths; // 0, 4, or 8

  // 大運干支: 順行は月柱の次から、逆行は月柱の前から
  const runs = [];
  // 0歳から立運まで: 月柱
  runs.push({ age: 0, gz: GZ[monthPillarIdx], isPre: true });

  for (let i = 0; i < 10; i++) {
    let idx;
    if (isForward) {
      idx = ((monthPillarIdx + 1 + i) % 60 + 60) % 60;
    } else {
      idx = ((monthPillarIdx - 1 - i) % 60 + 60) % 60;
    }
    const age = startAge + i * 10;
    runs.push({ age, gz: GZ[idx], isPre: false, startMonth });
  }

  return { runs, startAge, startMonth, isForward, days };
}

function calc(){
  const errEl=document.getElementById('err');
  errEl.classList.add('hidden');
  const bd=document.getElementById('bdate').value;
  const bt=document.getElementById('btime').value;
  if(!bd){errEl.textContent='生年月日を入力してください';errEl.classList.remove('hidden');return;}
  const [y,mo,d]=bd.split('-').map(Number);
  if(y < 1926 || y > 2027){errEl.textContent='対応範囲は1926年〜2027年です';errEl.classList.remove('hidden');return;}
  const hasTime=bt!=='';
  const [h,mi]=hasTime?bt.split(':').map(Number):[0,0];
  const city=CITIES[document.getElementById('city').value];

  // 地方時差（分）
  const localDiff=(city.lon-135)*4;
  // 均時差（分）
  const eot=getEOT(mo,d);
  // サマータイム判定（1時間=60分を引く）
  const summerTime = [
    {y:1948, start:[5,2], end:[9,11]},
    {y:1949, start:[4,3], end:[9,10]},
    {y:1950, start:[5,7], end:[9,9]},
    {y:1951, start:[5,6], end:[9,8]},
  ];
  let stOffset = 0;
  if(hasTime) {
    for(const st of summerTime) {
      if(y === st.y) {
        const dateNum = mo*100+d;
        const startNum = st.start[0]*100+st.start[1];
        const endNum = st.end[0]*100+st.end[1];
        if(dateNum >= startNum && dateNum <= endNum) {
          stOffset = -60; // サマータイム期間は1時間引く
          break;
        }
      }
    }
  }
  // 日柱・時柱用: 地方時差＋均時差＋サマータイム補正を加算（先に分単位へ丸めて「XX:60」表示を防ぐ）
  let total=Math.round(h*60+mi+(hasTime?(localDiff+eot+stOffset):0));
  let ad=d,amo=mo,ay=y;
  if(total>=1440){total-=1440;ad++;}
  else if(total<0){total+=1440;ad--;}
  const dim=new Date(ay,amo,0).getDate();
  if(ad>dim){ad-=dim;amo++;if(amo>12){amo=1;ay++;}}
  else if(ad<1){amo--;if(amo<1){amo=12;ay--;}ad+=new Date(ay,amo,0).getDate();}
  const ah=Math.floor(total/60);
  const am=total%60;

  // 年柱・月柱: 補正なし（入力値そのまま）
  const py=getPYear(y,mo,d,h,mi);
  const sm=getSolarMonth(y,mo,d,h,mi);
  const yi=yearIdx(py);
  const mi2=monthIdx(py,sm);
  // 日柱・時柱: 地方時差＋均時差補正後
  const di=dayIdx(ay,amo,ad);
  const hi=hasTime?hourIdx(di,ah):null;
  // 左から時・日・月・年の順
  const pillars=[
    {label:'時柱', gz: hi!==null ? GZ[hi] : null},
    {label:'日柱', gz:GZ[di]},
    {label:'月柱', gz:GZ[mi2]},
    {label:'年柱', gz:GZ[yi]}
  ];
  document.getElementById('pillars').innerHTML=pillars.map(p=>{
    const stem = p.gz ? p.gz[0] : '？';
    const branch = p.gz ? p.gz[1] : '？';
    return `<div class="pillar">
      <div class="plabel">${p.label}</div>
      <div class="pval">
        <span class="stem">${stem}</span>
        <span class="branch">${branch}</span>
      </div>
    </div>`;
  }).join('');
  const stInfo = stOffset !== 0 ? ' ／ サマータイム補正: -60分' : '';
  const infoText = hasTime
    ? `出生地: ${city.n} ／ 地方時差: ${localDiff.toFixed(1)}分 ／ 均時差: ${eot.toFixed(1)}分${stInfo} ／ 補正後時刻: ${String(ah).padStart(2,'0')}:${String(am).padStart(2,'0')}`
    : `出生地: ${city.n}`;
  document.getElementById('info').innerHTML=infoText;
  document.getElementById('result').classList.remove('hidden');

  // 大運計算
  const gender = document.getElementById('gender').value;
  const yearStemIdx = yearIdx(py) % 10;
  const daiun = calcDaiun(y, mo, d, mi2, yearStemIdx, gender, y);

  if (daiun) {
    const { runs, startAge, startMonth, isForward } = daiun;
    const direction = isForward ? '順行' : '逆行';
    const startLabel = startMonth > 0
      ? `${startAge}歳${startMonth}ヶ月`
      : `${startAge}歳`;

    // 現在の年齢を計算（誕生日前なら1引く）
    const today = new Date();
    let ageNow = today.getFullYear() - y;
    if ((today.getMonth() + 1) * 100 + today.getDate() < mo * 100 + d) ageNow--;

    let html = `<div class="daiun-title">大運（${direction} / 立運 ${startLabel}）</div>`;
    html += `<table class="daiun-table">`;

    runs.forEach((r, i) => {
      const stem = r.gz[0];
      const branch = r.gz[1];
      const isCurrent = !r.isPre && ageNow >= r.age && (i === runs.length - 1 || ageNow < runs[i + 1].age);
      const isPreRun = r.isPre;
      const isCurrentPre = isPreRun && ageNow < runs[1].age; // 立運前が現在の大運
      const rowCls = (isCurrent || isCurrentPre) ? 'current' : (isPreRun ? 'pre' : '');

      let ageLabel;
      if (isPreRun) {
        ageLabel = startMonth > 0
          ? `0歳〜${startAge}歳${startMonth}ヶ月（〜${y + startAge}年）`
          : `0歳〜${startAge}歳（〜${y + startAge}年）`;
      } else {
        const thisAge = startAge + (i - 1) * 10;
        const nextAge = thisAge + 10;
        const thisYear = y + thisAge;
        const nextYear = y + nextAge;
        const startStr = startMonth > 0 ? `${thisAge}歳${startMonth}ヶ月` : `${thisAge}歳`;
        const endStr = startMonth > 0 ? `${nextAge}歳${startMonth}ヶ月` : `${nextAge}歳`;
        ageLabel = `${startStr}〜${endStr}（${thisYear}〜${nextYear}年）`;
      }

      html += `<tr class="${rowCls}">
        <td class="age">${ageLabel}</td>
        <td><span class="gz-stem">${stem}</span><span class="gz-branch">${branch}</span></td>
      </tr>`;
    });

    html += `</table>`;
    document.getElementById('daiun').innerHTML = html;
    document.getElementById('daiun-card').classList.remove('hidden');
  }
}
</script>
