<style>
  :root{
    --accent:#b1a4dc;
    --bg:#efe8dd;
    --card:#ffffff;
    --ink:#333333;
    --ink-soft:#999999;
    --f-maru:'Zen Maru Gothic','Hiragino Maru Gothic ProN',sans-serif;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{
    font-family:'Noto Sans JP','Hiragino Sans',sans-serif;
    background:var(--bg); color:var(--ink);
    min-height:100%;
    display:flex; justify-content:center;
    padding:2rem 1rem 3rem;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{ width:100%; max-width:420px; }

  .back{
    display:inline-block; font-size:12px; color:var(--accent);
    text-decoration:none; margin-bottom:14px; letter-spacing:.08em;
  }
  .back:hover{ text-decoration:underline; }

  .header{
    background:var(--accent); border-radius:12px;
    padding:1rem 1rem .95rem; margin-bottom:1.2rem; text-align:center;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
  }
  .header .logo{ width:118px; height:auto; display:block; margin:0 auto .45rem; }
  .header .htitle{
    font-family:var(--f-maru);
    font-size:1.2rem; font-weight:500; color:#fff;
    letter-spacing:.1em; padding-left:.1em; white-space:nowrap;
  }

  .lead{
    font-size:13px; line-height:1.9; color:var(--ink-soft);
    text-align:center; margin-bottom:1.3rem; letter-spacing:.04em;
  }

  /* 生年月日入力 */
  .picker{
    background:var(--card); border-radius:12px; padding:1.1rem 1rem 1.2rem;
    box-shadow:0 2px 8px rgba(0,0,0,.06); margin-bottom:1.3rem;
  }
  .picker .row{ display:flex; gap:6px; align-items:flex-end; justify-content:center; }
  .fld{ display:flex; flex-direction:column; align-items:center; }
  .fld label{ font-size:11px; color:var(--ink-soft); letter-spacing:.1em; margin-bottom:5px; }
  .fld .box{ display:flex; align-items:baseline; gap:3px; }
  .picker input{
    font-family:inherit; font-size:17px; color:var(--ink); text-align:center;
    padding:10px 6px; border:1px solid #ddd; border-radius:8px;
    background:#fafafa; -webkit-appearance:none; appearance:none;
  }
  .picker input::-webkit-outer-spin-button,
  .picker input::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
  .picker input[type=number]{ -moz-appearance:textfield; }
  .picker input:focus{ outline:none; border-color:var(--accent); background:#fff; }
  #y{ width:88px; } #m,#d{ width:62px; }
  .unit{ font-size:13px; color:var(--ink-soft); }
  .picker button{
    display:block; width:100%; margin-top:1rem;
    font-family:inherit; font-size:15px; font-weight:500; color:#fff;
    padding:13px 16px; border:none; border-radius:8px;
    background:var(--accent); cursor:pointer; letter-spacing:.12em;
  }
  .picker button:hover{ opacity:.88; }
  .err{
    font-size:12px; color:#8d7fc0; text-align:center;
    margin-top:.8rem; letter-spacing:.04em; line-height:1.7;
  }
  .err:empty{ display:none; }

  /* 結果 */
  .result{
    background:var(--card); border-radius:12px; padding:2rem 1rem 1.9rem;
    box-shadow:0 2px 8px rgba(0,0,0,.06); text-align:center;
    opacity:0; transform:translateY(6px);
    transition:opacity .35s ease, transform .35s ease;
  }
  .result.show{ opacity:1; transform:none; }
  .result .cap{
    font-family:var(--f-maru);
    font-size:11px; letter-spacing:.22em; color:var(--ink-soft);
    margin-bottom:.55rem;
  }
  .result .yomi{
    font-weight:700;
    font-size:.95rem; color:var(--accent); letter-spacing:.14em; margin-bottom:.55rem;
  }
  .result .gk{
    font-size:4.2rem; font-weight:700; line-height:1.15;
    letter-spacing:.12em; padding-left:.12em; color:var(--ink);
  }
  .result .type{
    font-family:var(--f-maru);
    font-size:1.05rem; font-weight:500; letter-spacing:.12em;
    color:var(--ink); margin-top:.85rem;
  }
  .result .type:empty{ display:none; }

  .note{
    font-size:11.5px; line-height:2; color:var(--ink-soft);
    margin-top:1.3rem; letter-spacing:.03em;
  }
  .note b{ font-weight:500; color:var(--ink); }

  .sig{
    font-size:11px; color:var(--ink-soft); text-align:right;
    margin-top:1.8rem; letter-spacing:.06em;
  }
</style>

  <p class="lead">生年月日を入れると<br>あなたの日干支（にっかんし）がわかります</p>

  <div class="picker">
    <div class="row">
      <div class="fld">
        <label for="y">年</label>
        <div class="box"><input type="number" id="y" inputmode="numeric" placeholder="1990"><span class="unit">年</span></div>
      </div>
      <div class="fld">
        <label for="m">月</label>
        <div class="box"><input type="number" id="m" inputmode="numeric" placeholder="1"><span class="unit">月</span></div>

        <label for="d">日</label>
        <div class="box"><input type="number" id="d" inputmode="numeric" placeholder="1"><span class="unit">日</span></div>

  </p>

<script>
/* ===== 干支・読み（kyou-no-kanshi.html と共通） ===== */
const STEMS    = ["甲","乙","丙","丁","戊","己","庚","辛","壬","癸"];
const BRANCHES = ["子","丑","寅","卯","辰","巳","午","未","申","酉","戌","亥"];
const STEM_YOMI   = ["きのえ","きのと","ひのえ","ひのと","つちのえ","つちのと","かのえ","かのと","みずのえ","みずのと"];
const BRANCH_YOMI = ["ね","うし","とら","う","たつ","み","うま","ひつじ","さる","とり","いぬ","い"];

/* ===== 日干のタイプ名 =====
   並びは 甲・乙・丙・丁・戊・己・庚・辛・壬・癸 の順 */
const STEM_TYPE = [
  "樹木タイプ",    // 甲
  "草花タイプ",    // 乙
  "太陽タイプ",    // 丙
  "灯火タイプ",    // 丁
  "山タイプ",      // 戊
  "大地タイプ",    // 己
  "岩・刀タイプ",  // 庚
  "宝石タイプ",    // 辛
  "海タイプ",      // 壬
  "雨タイプ"       // 癸
];

/* ===== 日干支の計算（kyou-no-kanshi.html と同一ロジック） ===== */
function dayIdx(y,mo,d){
  const base=new Date(1900,0,1).getTime();
  const target=new Date(y,mo-1,d).getTime();
  const diff=Math.round((target-base)/86400000);
  return((10+diff)%60+60)%60;
}

const $ = id => document.getElementById(id);

function show(msg){ $("err").textContent = msg; }

function run(){
  show("");
  const y=parseInt($("y").value,10), m=parseInt($("m").value,10), d=parseInt($("d").value,10);

  if(!y || !m || !d){ show("年・月・日をすべて入れてください。"); return; }
  if(y<1900 || y>2100){ show("1900年から2100年のあいだで入れてください。"); return; }
  if(m<1 || m>12){ show("月は1〜12で入れてください。"); return; }
  if(d<1 || d>31){ show("日は1〜31で入れてください。"); return; }

  /* 2月30日のような存在しない日をはじく */
  const dt=new Date(y,m-1,d);
  if(dt.getFullYear()!==y || dt.getMonth()!==m-1 || dt.getDate()!==d){
    show(y+"年"+m+"月"+d+"日は存在しない日付です。もう一度ご確認ください。");
    return;
  }

  const i=dayIdx(y,m,d), s=i%10, b=i%12;

  $("ymi").textContent  = STEM_YOMI[s]+BRANCH_YOMI[b];
  $("gk").textContent   = STEMS[s]+BRANCHES[b];
  $("typ").textContent  = STEM_TYPE[s]||"";
  $("res").classList.add("show");
}

$("go").addEventListener("click", run);

/* Enter で実行（日本語変換の確定Enterは拾わない） */
["y","m","d"].forEach(id=>{
  const el=$(id);
  let composing=false, compEnd=0;
  el.addEventListener("compositionstart",()=>{composing=true;});
  el.addEventListener("compositionend",()=>{composing=false;compEnd=Date.now();});
  el.addEventListener("keydown",e=>{
    if(e.key!=="Enter") return;
    if(composing||e.isComposing||e.keyCode===229||Date.now()-compEnd<120) return;
    e.preventDefault(); run();
  });
});
</script>
